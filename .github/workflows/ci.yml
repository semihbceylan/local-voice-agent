name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suites:
    name: offline test suites
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Order parser
        run: node --test tests/parser/

      - name: Voice activity detection
        run: python tests/test_vad.py

      - name: Call mode
        run: python tests/test_call_mode.py

      - name: Farewell detection
        run: python tests/test_farewell.py
