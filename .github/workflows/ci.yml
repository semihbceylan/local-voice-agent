name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline-suites:
    name: offline test suites
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install ffmpeg and whisper.cpp
        # whisper.cpp has a bottle for macOS 15, so no source build is needed.
        run: |
          brew install ffmpeg
          brew install whisper.cpp

      - name: Download the Whisper model
        # The model is 141 MB and not part of the repository.
        run: |
          curl -fL --progress-bar -o ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      - name: Prepare the speech fixture
        # The fixture is generated locally with Kokoro, so no recording of a
        # real microphone is part of the repository.
        run: python tests/fixtures_gen.py

      - name: Order parser
        run: node --test tests/parser/

      - name: Voice activity detection
        run: python tests/test_vad.py

      - name: Call mode
        run: python tests/test_call_mode.py

      - name: Farewell detection
        run: python tests/test_farewell.py

      - name: Workflow build guard
        run: python tests/test_workflow_build.py

      - name: Speech recognition reliability
        run: python tests/stt_reliability.py
